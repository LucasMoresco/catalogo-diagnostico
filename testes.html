<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Acompanhamento de testes · Resolução de problemas</title>
<style>
  :root{--bg:#0f1622;--pan:#151f2e;--pan2:#1a2637;--bd:#26334a;--tx:#e6edf6;--mut:#9fb0c6;--or:#ff6a3d;
        --gray:#7c8aa3;--blue:#4b8bf5;--rd:#e06a6a;--yl:#e0b341;--gr:#3fb27f}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 -apple-system,"Segoe UI",Roboto,Arial,sans-serif}
  .wrap{max-width:1100px;margin:0 auto;padding:26px 18px 100px}
  h1{font-size:21px;margin:0 0 2px}
  .sub{color:var(--mut);font-size:12.5px}
  .bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:14px 0;background:var(--pan);border:1px solid var(--bd);border-radius:10px;padding:12px 14px;position:sticky;top:0;z-index:5}
  .prog{flex:1;min-width:180px;height:10px;border-radius:6px;background:#0b1220;overflow:hidden;display:flex}
  .prog i{display:block;height:100%}
  .pill{font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid var(--bd);background:var(--pan2);color:var(--mut);white-space:nowrap}
  .pill b{color:var(--tx)}
  .pill.dot::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}
  .pill.c-conc::before{background:var(--gr)} .pill.c-parc::before{background:var(--yl)}
  .pill.c-falhou::before{background:var(--rd)} .pill.c-ini::before{background:var(--blue)}
  .pill.c-nao::before{background:var(--gray)}
  button{font:inherit;font-size:12.5px;font-weight:600;padding:7px 12px;border-radius:7px;border:1px solid var(--or);background:var(--or);color:#fff;cursor:pointer}
  button.sec{background:var(--pan2);color:var(--tx);border-color:var(--bd)}
  button:disabled{opacity:.5;cursor:default}
  .fam{font-size:15px;color:var(--or);margin:26px 0 6px;font-weight:700}
  .caso{background:var(--pan);border:1px solid var(--bd);border-radius:10px;margin:10px 0;overflow:hidden}
  .caso>h3{margin:0;padding:11px 15px;font-size:14px;background:var(--pan2);border-bottom:1px solid var(--bd)}
  .row{padding:14px 15px;border-bottom:1px solid var(--bd)}
  .row:last-child{border-bottom:none}
  .rtop{display:grid;grid-template-columns:48px 1fr;gap:14px;align-items:start}
  .code{color:var(--or);font-weight:700;font-family:monospace;font-size:14px;padding-top:1px}
  .meta .fala{font-weight:600;font-size:13.5px}
  .meta .ctx{color:var(--mut);margin-top:3px;font-size:12.8px} .meta .exp{color:#bcd0ea;margin-top:3px;font-size:12.8px}
  .statusbtns{display:flex;flex-wrap:wrap;border:1px solid var(--bd);border-radius:8px;overflow:hidden;margin-top:12px}
  .sb{flex:1 1 0;min-width:72px;font-size:12px;font-weight:600;padding:9px 8px;border:none;border-right:1px solid var(--bd);background:var(--pan2);color:var(--mut);border-radius:0;white-space:nowrap;text-align:center}
  .sb:last-child{border-right:none}
  .sb:hover{color:var(--tx);background:#20304a}
  .sb.on{color:#fff;cursor:default}
  .sb.on.sb-nao{background:var(--gray);color:#0f1622} .sb.on.sb-ini{background:var(--blue)}
  .sb.on.sb-falhou{background:var(--rd)} .sb.on.sb-parcial{background:var(--yl);color:#141c28} .sb.on.sb-concluido{background:var(--gr)}
  input,textarea{font:inherit;background:#0b1220;color:var(--tx);border:1px solid var(--bd);border-radius:7px;padding:9px 11px}
  .nt{width:100%;font-size:13px;resize:vertical;min-height:84px;margin-top:12px;line-height:1.5}
  .nt:focus{outline:none;border-color:var(--or)}
  .st-nao_concluido{border-left:3px solid var(--gray)} .st-em_andamento{border-left:3px solid var(--blue)}
  .st-falhou{border-left:3px solid var(--rd)} .st-parcial{border-left:3px solid var(--yl)} .st-concluido{border-left:3px solid var(--gr)}
  .savemark{font-size:11px;color:var(--mut);min-height:14px;margin-top:5px;display:inline-block}
  .savemark.ok{color:var(--gr)} .savemark.err{color:var(--rd)}
  .add{background:var(--pan);border:1px dashed var(--bd);border-radius:10px;padding:15px;margin:18px 0;display:none}
  .add.open{display:block}
  .add .grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:9px 0}
  .add input{width:100%}
  #err{color:var(--rd);font-size:12.5px;margin:8px 0}
  .wfwrap{font-size:12px;color:var(--mut);display:flex;align-items:center;gap:6px;font-weight:700;white-space:nowrap}
  #wfsel{font:inherit;font-size:12.5px;font-weight:700;background:var(--pan2);color:var(--tx);border:1px solid var(--or);border-radius:7px;padding:6px 9px;cursor:pointer}
  @media(max-width:720px){.sb{font-size:11px;padding:8px 5px;min-width:64px}}
</style></head><body><div class="wrap">

<h1>Acompanhamento de testes</h1>
<div class="sub">Resolução de problemas · status por <b>workflow</b> (selecione abaixo) · compartilhado (você e a IA) · lab.pulsus.mobi</div>

<div class="bar">
  <label class="wfwrap">workflow: <select id="wfsel" onchange="setWorkflow(this.value)"></select></label>
  <div class="prog" id="prog"><i style="width:0;background:var(--gr)"></i><i style="width:0;background:var(--yl)"></i><i style="width:0;background:var(--rd)"></i><i style="width:0;background:var(--blue)"></i></div>
  <span class="pill dot c-conc" id="p-conc"><b>0</b> concluídos</span>
  <span class="pill dot c-parc" id="p-parc"><b>0</b> parciais</span>
  <span class="pill dot c-falhou" id="p-falhou"><b>0</b> falhas</span>
  <span class="pill dot c-ini" id="p-ini"><b>0</b> iniciados</span>
  <span class="pill dot c-nao" id="p-nao"><b>0</b> não iniciados</span>
  <button class="sec" onclick="load()">Atualizar</button>
  <button onclick="toggleAdd()">+ Adicionar caso</button>
</div>

<div id="err"></div>

<div class="add" id="addbox">
  <b>Novo caso</b> (segue o padrão Caso N.x)
  <div class="grid">
    <input id="a-code" placeholder="código (ex.: 15.1)">
    <input id="a-caso" placeholder="caso (ex.: Caso 15 · Rede / conectividade)">
  </div>
  <div class="grid">
    <input id="a-family" placeholder="família (ex.: Família D · Rede)">
    <input id="a-fala" placeholder="fala do usuário">
  </div>
  <div class="grid">
    <input id="a-contexto" placeholder="contexto (telemetria/estado)">
    <input id="a-esperado" placeholder="resultado esperado">
  </div>
  <button onclick="addCase()">Salvar caso</button>
  <button class="sec" onclick="toggleAdd()">Cancelar</button>
</div>

<div id="content"><p style="color:var(--mut)">Carregando…</p></div>

<script>
// TestTracker API v2 — status por workflow (tabela test_results, chave (code, workflow))
const GET_LIST    = 'https://lab.pulsus.mobi/webhook/2caf0c35-fe9c-418a-ace9-6054e559724d';
const POST_RESULT = 'https://lab.pulsus.mobi/webhook/454ee1dc-37e2-4d7a-a327-8fa85c13414c';
const POST_CASE   = 'https://lab.pulsus.mobi/webhook/4adce02d-8e55-4fc3-8c72-14696785f973';
const KEY  = '2d0964832e944bcea13748bce33fc7cc';
// workflows testaveis (casam com o seletor do device)
const WORKFLOWS = [
  { id:'autonomous', label:'Autonomous original' },
  { id:'vinicius',   label:'Vinícius (2mDb)' },
  { id:'lucas',      label:'[Lucas]' },
  { id:'demo',       label:'Demo [Lucas]' },
];
const WF_KEY = 'tracker_wf';
let currentWf = (function(){ try{ return localStorage.getItem(WF_KEY) || 'vinicius'; }catch(e){ return 'vinicius'; } })();
// [valor no banco, classe do botao, rotulo]  -- ordem = pior -> melhor apos iniciar
const SB   = [
  ['nao_concluido','nao','Não iniciado'],
  ['em_andamento','ini','Iniciado'],
  ['falhou','falhou','Falhou'],
  ['parcial','parcial','Parcial'],
  ['concluido','concluido','Concluído'],
];
const CLS  = { nao_concluido:'sb-nao', em_andamento:'sb-ini', falhou:'sb-falhou', parcial:'sb-parcial', concluido:'sb-concluido' };
function esc(s){const d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML;}
function el(id){return document.getElementById(id);}
function initWfSelector(){ const sel=el('wfsel'); if(!sel) return; sel.innerHTML=WORKFLOWS.map(w=>'<option value="'+w.id+'"'+(w.id===currentWf?' selected':'')+'>'+esc(w.label)+'</option>').join(''); }
function setWorkflow(id){ currentWf=id; try{ localStorage.setItem(WF_KEY,id); }catch(e){} load(); }

async function load(){
  el('err').textContent='';
  try{
    const r = await fetch(GET_LIST+'?workflow='+encodeURIComponent(currentWf), { headers:{'x-audit-key':KEY} });
    const data = await r.json();
    if(!Array.isArray(data) || (data[0]&&data[0].error)) throw new Error((data[0]&&data[0].error)||'resposta inesperada');
    render(data);
  }catch(e){ el('err').textContent='Falha ao carregar: '+e.message; }
}

function render(rows){
  const byFam={};
  rows.forEach(r=>{ (byFam[r.family]=byFam[r.family]||{})[r.caso]=(byFam[r.family][r.caso]||[]); byFam[r.family][r.caso].push(r); });
  let html='';
  for(const fam in byFam){
    html+='<div class="fam">'+esc(fam)+'</div>';
    for(const caso in byFam[fam]){
      html+='<div class="caso"><h3>'+esc(caso)+'</h3>';
      byFam[fam][caso].forEach(r=>{
        const c=esc(r.code);
        const st=normStatus(r.status);
        const btns=SB.map(x=>'<button class="sb sb-'+x[1]+(st===x[0]?' on':'')+'" onclick="saveStatus(\''+c+'\',\''+x[0]+'\')">'+x[2]+'</button>').join('');
        html+='<div class="row st-'+esc(st)+'" id="row-'+c+'">'
          +'<div class="rtop">'
            +'<div class="code">'+c+'</div>'
            +'<div class="meta"><div class="fala">'+esc(r.fala)+'</div>'
              +(r.contexto?'<div class="ctx">contexto: '+esc(r.contexto)+'</div>':'')
              +(r.esperado?'<div class="exp">esperado: '+esc(r.esperado)+'</div>':'')+'</div>'
          +'</div>'
          +'<div class="statusbtns">'+btns+'</div>'
          +'<textarea class="nt" id="nt-'+c+'" placeholder="notas do teste (observações, evidência, execução, o que passou / o que falhou)" onblur="saveNote(\''+c+'\')">'+esc(r.notes||'')+'</textarea>'
          +'<span class="savemark" id="mk-'+c+'"></span>'
          +'</div>';
      });
      html+='</div>';
    }
  }
  el('content').innerHTML=html;
  updateProgress();
}
// compat: status antigos e valores desconhecidos caem em "nao_concluido"
function normStatus(s){ return CLS[s] ? s : 'nao_concluido'; }

function updateProgress(){
  const rows=document.querySelectorAll('.row'); const n=rows.length; let c=0,p=0,f=0,i=0;
  rows.forEach(r=>{
    if(r.classList.contains('st-concluido'))c++;
    else if(r.classList.contains('st-parcial'))p++;
    else if(r.classList.contains('st-falhou'))f++;
    else if(r.classList.contains('st-em_andamento'))i++;
  });
  const nao=n-c-p-f-i;
  el('p-conc').innerHTML='<b>'+c+'</b> concluídos'; el('p-parc').innerHTML='<b>'+p+'</b> parciais';
  el('p-falhou').innerHTML='<b>'+f+'</b> falhas'; el('p-ini').innerHTML='<b>'+i+'</b> iniciados';
  el('p-nao').innerHTML='<b>'+nao+'</b> não iniciados';
  const pr=el('prog').children;
  pr[0].style.width=(n?100*c/n:0)+'%'; pr[1].style.width=(n?100*p/n:0)+'%';
  pr[2].style.width=(n?100*f/n:0)+'%'; pr[3].style.width=(n?100*i/n:0)+'%';
}

async function post(url, payload, mark){
  if(mark){ mark.className='savemark'; mark.textContent='salvando…'; }
  const r=await fetch(url,{method:'POST',headers:{'x-audit-key':KEY,'Content-Type':'application/json'},body:JSON.stringify(payload)});
  const d=await r.json(); const row=Array.isArray(d)?d[0]:d;
  if(row&&row.error) throw new Error(row.error);
  if(mark){ mark.className='savemark ok'; mark.textContent='salvo ✓'; setTimeout(()=>{if(mark.textContent==='salvo ✓')mark.textContent='';},1600); }
  return row;
}
function saveStatus(code,status){
  const row=el('row-'+code);
  if(row){
    row.className='row st-'+status;
    row.querySelectorAll('.sb').forEach(b=>b.classList.remove('on'));
    const b=row.querySelector('.'+CLS[status]); if(b) b.classList.add('on');
  }
  updateProgress();
  post(POST_RESULT,{code,workflow:currentWf,status}, el('mk-'+code)).catch(()=>{ if(el('mk-'+code)){el('mk-'+code).className='savemark err';el('mk-'+code).textContent='erro ao salvar';} });
}
function saveNote(code){
  post(POST_RESULT,{code,workflow:currentWf,notes:el('nt-'+code).value}, el('mk-'+code)).catch(()=>{ if(el('mk-'+code)){el('mk-'+code).className='savemark err';el('mk-'+code).textContent='erro ao salvar';} });
}
function toggleAdd(){ el('addbox').classList.toggle('open'); }
async function addCase(){
  const p={code:el('a-code').value.trim(),caso:el('a-caso').value.trim(),family:el('a-family').value.trim(),
           fala:el('a-fala').value.trim(),contexto:el('a-contexto').value.trim(),esperado:el('a-esperado').value.trim(),
           seq:999};
  if(!p.code){ el('err').textContent='Informe o código do caso.'; return; }
  try{ await post(POST_CASE,p,null); ['a-code','a-caso','a-family','a-fala','a-contexto','a-esperado'].forEach(i=>el(i).value=''); toggleAdd(); load(); }
  catch(e){ el('err').textContent='Falha ao adicionar: '+e.message; }
}
initWfSelector(); load();
</script>
</div></body></html>
